<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gastos</title>
  <meta name="description" content="Registro pessoal de despesas: quanto você gastou, em quê e quando.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="format-detection" content="telephone=no">

  <!-- Instalação como aplicativo (todos os caminhos são relativos: funciona em subpastas do GitHub Pages) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gastos">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">

  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js"></script>
</head>
<body>
  <!-- Abertura: só aparece se o app demorar a carregar (ver .splash em style.css) -->
  <div class="splash" aria-hidden="true"><svg class="splash-mark"><use href="#i-logo"></use></svg></div>

  <a class="skip-link" href="#main">Pular para o conteúdo</a>

  <div class="app" id="app">
    <!-- Cabeçalho compacto de vidro: aparece quando o título grande sai da tela -->
    <div class="topbar" aria-hidden="true">
      <span class="topbar-title"></span>
      <span class="topbar-detail"></span>
    </div>

    <nav class="tabbar" aria-label="Principal">
      <div class="tabbar-brand" aria-hidden="true">
        <svg class="icon brand-mark"><use href="#i-logo"></use></svg><span data-app-name>Gastos</span>
      </div>
      <div class="tabbar-tabs">
        <span class="tab-lens" aria-hidden="true"></span>
        <a class="tab" href="#/" data-route="home">
          <span class="tab-icon" aria-hidden="true">
            <svg class="icon icon-line"><use href="#i-home"></use></svg><svg class="icon icon-fill"><use href="#i-home-fill"></use></svg>
          </span><span class="tab-label">Início</span>
        </a>
        <a class="tab" href="#/historico" data-route="history">
          <span class="tab-icon" aria-hidden="true">
            <svg class="icon icon-line"><use href="#i-history"></use></svg><svg class="icon icon-fill"><use href="#i-history-fill"></use></svg>
          </span><span class="tab-label">Histórico</span>
        </a>
        <a class="tab" href="#/analise" data-route="analysis">
          <span class="tab-icon" aria-hidden="true">
            <svg class="icon icon-line"><use href="#i-chart"></use></svg><svg class="icon icon-fill"><use href="#i-chart-fill"></use></svg>
          </span><span class="tab-label">Análise</span>
        </a>
        <a class="tab" href="#/ajustes" data-route="settings">
          <span class="tab-icon" aria-hidden="true">
            <svg class="icon icon-line"><use href="#i-settings"></use></svg><svg class="icon icon-fill"><use href="#i-settings-fill"></use></svg>
          </span><span class="tab-label">Ajustes</span>
        </a>
      </div>
      <button type="button" class="fab" data-action="add-expense" aria-label="Nova despesa" title="Nova despesa (N)">
        <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg><span class="fab-label">Nova despesa</span>
      </button>
    </nav>

    <!-- Efeito de borda: o conteúdo se dissolve ao passar por baixo da barra de abas -->
    <div class="scroll-edge" aria-hidden="true"></div>

    <main id="main" class="main" tabindex="-1">
      <section class="view" id="view-home" aria-label="Início"></section>
      <section class="view" id="view-history" aria-label="Histórico" hidden></section>
      <section class="view" id="view-analysis" aria-label="Análise" hidden></section>
      <section class="view" id="view-settings" aria-label="Ajustes" hidden></section>
    </main>
  </div>

  <div class="sheet-layer" id="sheet-layer" hidden>
    <div class="sheet-backdrop"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"></div>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite" role="status"></div>

  <noscript>
    <p class="fallback">Este aplicativo precisa de JavaScript ativado para funcionar.</p>
  </noscript>
  <script nomodule>
    document.body.insertAdjacentHTML('beforeend',
      '<p class="fallback">Este navegador é antigo demais para o aplicativo. Atualize o sistema ou use outro navegador.</p>');
  </script>
