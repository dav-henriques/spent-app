<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gastos</title>
  <meta name="description" content="Registro pessoal de despesas: quanto você gastou, em quê e quando.">
  <meta name="theme-color" content="#090909">
  <meta name="color-scheme" content="dark">
  <meta name="format-detection" content="telephone=no">

  <!-- Instalação como aplicativo (todos os caminhos são relativos: funciona em subpastas do GitHub Pages) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gastos">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">

  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  <div class="status-bar-bg" aria-hidden="true"></div>

  <div class="app" id="app">
    <nav class="tabbar" aria-label="Principal">
      <div class="tabbar-brand" aria-hidden="true">
        <svg class="icon brand-mark"><use href="#i-logo"></use></svg><span data-app-name>Gastos</span>
      </div>
      <a class="tab" href="#/" data-route="home">
        <svg class="icon" aria-hidden="true"><use href="#i-home"></use></svg><span>Início</span>
      </a>
      <a class="tab" href="#/historico" data-route="history">
        <svg class="icon" aria-hidden="true"><use href="#i-history"></use></svg><span>Histórico</span>
      </a>
      <button type="button" class="tab-add" data-action="add-expense" aria-label="Nova despesa" title="Nova despesa (N)">
        <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg><span class="tab-add-label">Nova despesa</span>
      </button>
      <a class="tab" href="#/analise" data-route="analysis">
        <svg class="icon" aria-hidden="true"><use href="#i-chart"></use></svg><span>Análise</span>
      </a>
      <a class="tab" href="#/ajustes" data-route="settings">
        <svg class="icon" aria-hidden="true"><use href="#i-settings"></use></svg><span>Ajustes</span>
      </a>
    </nav>

    <main id="main" class="main" tabindex="-1">
      <section class="view" id="view-home" aria-label="Início"></section>
      <section class="view" id="view-history" aria-label="Histórico" hidden></section>
      <section class="view" id="view-analysis" aria-label="Análise" hidden></section>
      <section class="view" id="view-settings" aria-label="Ajustes" hidden></section>
    </main>
  </div>

  <div class="sheet-layer" id="sheet-layer" hidden>
    <div class="sheet-backdrop"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"></div>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite"></div>

  <noscript>
    <p class="fallback">Este aplicativo precisa de JavaScript ativado para funcionar.</p>
  </noscript>
  <script nomodule>
    document.body.insertAdjacentHTML('beforeend',
      '<p class="fallback">Este navegador é antigo demais para o aplicativo. Atualize o sistema ou use outro navegador.</p>');
  </script>

  <!-- Ícones da interface (traço de 1,8 px, herdam a cor do texto) -->
  <svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-logo" viewBox="0 0 24 24">
        <g fill="none" stroke-width="3.2" stroke-linecap="round">
          <path d="M14.27 3.91A8.4 8.4 0 0 1 18.59 17.21" stroke="#F2C14E"/>
          <path d="M14.91 19.88A8.4 8.4 0 0 1 6.79 18.59" stroke="#4F8BFF"/>
          <path d="M4.12 14.91A8.4 8.4 0 0 1 4.12 9.09" stroke="#FF5C5C"/>
          <path d="M6.79 5.41A8.4 8.4 0 0 1 9.73 3.91" stroke="#9D7BFF"/>
        </g>
      </symbol>
      <symbol id="i-home" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M4 10.4 12 4l8 6.4V19a1 1 0 0 1-1 1h-4.2v-5.6H9.2V20H5a1 1 0 0 1-1-1z"/>
      </symbol>
      <symbol id="i-history" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.8 12a8.2 8.2 0 1 0 2.5-5.9"/><path d="M3.6 4.4v4h4"/><path d="M12 7.8v4.5l3 1.8"/>
        </g>
      </symbol>
      <symbol id="i-chart" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M5.5 19.5v-6M12 19.5v-15M18.5 19.5v-9.5"/>
        </g>
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 7.5h9M18.5 7.5H20M4 16.5h1.5M11 16.5h9"/>
          <circle cx="15.8" cy="7.5" r="2.3"/><circle cx="8.2" cy="16.5" r="2.3"/>
        </g>
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/>
      </symbol>
      <symbol id="i-chevron-left" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="m14.5 5.5-6.5 6.5 6.5 6.5"/>
      </symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="m9.5 5.5 6.5 6.5-6.5 6.5"/>
      </symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m6.5 9.5 5.5 5.5 5.5-5.5"/>
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="m6.5 6.5 11 11m0-11-11 11"/>
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.6 15.6 4.4 4.4"/></g>
      </symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <rect x="4" y="5.5" width="16" height="14.5" rx="2.6"/><path d="M4 10h16M8.5 3.5v3.5M15.5 3.5v3.5"/>
        </g>
      </symbol>
      <symbol id="i-sort" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 5v14M4.5 15.5 8 19l3.5-3.5M16 19V5M12.5 8.5 16 5l3.5 3.5"/>
        </g>
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/>
        </g>
      </symbol>
      <symbol id="i-upload" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 15.5v-11M7.5 9 12 4.5 16.5 9M5 19.5h14"/>
        </g>
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 7h15M9.5 7V4.8h5V7M6.8 7l.9 12.2a1 1 0 0 0 1 .9h6.6a1 1 0 0 0 1-.9L17.2 7"/>
        </g>
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m5.5 12.5 4.2 4.2 8.8-9.2"/>
      </symbol>
      <symbol id="i-info" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.2"/><path d="M12 11v5.2M12 7.8v.1"/></g>
      </symbol>
      <symbol id="i-share" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3.8v10.7M8.2 7.4 12 3.6l3.8 3.8"/><path d="M8.5 10.5H7a1.8 1.8 0 0 0-1.8 1.8v6.2A1.8 1.8 0 0 0 7 20.3h10a1.8 1.8 0 0 0 1.8-1.8v-6.2a1.8 1.8 0 0 0-1.8-1.8h-1.5"/>
        </g>
      </symbol>
      <symbol id="i-table" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <rect x="4" y="4.5" width="16" height="15" rx="2.6"/><path d="M4 9.5h16M4 14.5h16M10 9.5v10"/>
        </g>
      </symbol>
      <symbol id="i-device" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <rect x="6.5" y="3" width="11" height="18" rx="2.8"/><path d="M10.8 17.8h2.4"/>
        </g>
      </symbol>
      <symbol id="i-document" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
          <path d="M6.5 3.8h7l4 4v11.4a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1V4.8a1 1 0 0 1 1-1z"/><path d="M13.5 3.8v4h4"/>
        </g>
      </symbol>
    </defs>
  </svg>
</body>
</html>
